- aid: humanitec:humanitec-matchingcriteria-api
  name: Humanitec MatchingCriteria API
  description: >-
    Matching Criteria are a set of rules used to choose which Resource Definition to use to provision
    a particular Resource Type.


    Matching criteria are made up in order of specificity with least specific first:


    - Environment Type (`env_type`)


    - Application (`app_id`)


    - Environment (`env_id`)


    - Resource (`res_id`)


    When selecting matching criteria, the most specific one is selected. In general, this means of all
    the Matching Criteria fully matching the context, the Matching Criteria Rule with the most specific
    element filled is chosen. If there is a tie, the next most specific elements are compared and so on
    until one is chosen.


    **NOTE:**


    Humanitec will reject the registration of matching criteria rules that duplicate rules already present
    for a Resource Type.

    <SchemaDefinition schemaRef="#/components/schemas/MatchingCriteriaResponse" />
